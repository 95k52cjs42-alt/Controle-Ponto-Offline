<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="{{ url_for('manifesto_pwa') }}">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ponto">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <title>{% block title %}4Lab Orbit | App Ponto{% endblock %}</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-Ay26V7L8bsJTsX9Sxclnvsn+hkdiwRnrjZJXqKmkIDobPgIIWBOVguEcQQLDuhfN" crossorigin="anonymous">

    <!-- Script anti-flicker (padrão escuro) -->
    <script nonce="{{ csp_nonce() }}">
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        /* --- Variáveis de Tema (Escuro / Dark Padrão) --- */
        :root, [data-theme="dark"] {
            --bg-body: #0b0f19;      /* Fundo geral bem escuro */
            --bg-card: #182234;      /* Card em cinza escuro / grafite */
            --bg-input: #0f172a;     /* Inputs levemente mais escuros */
            --bg-navbar: #111827;    /* Topo escuro unificado */
            --border-color: #24334a; /* Bordas sutis para separar os elementos */
            
            --text-main: #f8fafc;    /* Texto principal claro */
            --text-muted: #94a3b8;   /* Texto secundário */
            
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
            
            --btn-bg: #3b82f6;       /* Azul principal de destaque */
            --btn-hover: #2563eb;
            --btn-text: #ffffff;
            
            --radius-xl: 24px;
            --radius-md: 14px;
        }

        /* --- Modo Claro (Opcional, acionado pelo toggle) --- */
        [data-theme="light"] {
            --bg-body: #f7f9fc;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-navbar: #ffffff;
            --border-color: #edf2f7;
            
            --text-main: #2d3748;
            --text-muted: #64748b;
            
            --shadow-sm: 0 4px 20px rgba(160, 175, 200, 0.08);
            --shadow-card: 0 10px 30px rgba(160, 175, 200, 0.12);
            
            --btn-bg: #1e293b;
            --btn-hover: #0f172a;
            --btn-text: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body) !important;
            color: var(--text-main);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Sobrescrita Global dos Cards e Inputs */
        .pastel-card, .main-card, .card {
            background-color: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: var(--shadow-card) !important;
            color: var(--text-main) !important;
            border-radius: var(--radius-xl);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .form-control {
            background-color: var(--bg-input) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
        }

        .form-control::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.6;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2) !important;
            border-color: #3b82f6 !important;
        }

        .btn-login {
            background-color: var(--btn-bg) !important;
            color: var(--btn-text) !important;
            border: none;
        }

        .btn-login:hover {
            background-color: var(--btn-hover) !important;
        }

        .text-dark {
            color: var(--text-main) !important;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .border-light, .border-top {
            border-color: var(--border-color) !important;
        }
    </style>
    <link href="{{ url_for('static', filename='css/tema.css') }}" rel="stylesheet">
</head>
<body>

    <!-- Cabeçalho flutuante compartilhado -->
    {% set cab_foto_modal = true %}
    {% include '_cabecalho.html' %}

    <!-- Modal Alterar Foto de Perfil -->
    {% if current_user.is_authenticated %}
    <div class="modal fade" id="modalFotoPerfil" tabindex="-1" aria-labelledby="modalFotoPerfilLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-dark" style="background-color: var(--bg-card); border-color: var(--border-color);">
                <div class="modal-header border-bottom border-secondary border-opacity-25 py-2">
                    <h6 class="modal-title fw-bold" id="modalFotoPerfilLabel"><i class="bi bi-person-circle me-1"></i> Foto de Perfil</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form action="{{ url_for('upload_foto_perfil') }}" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="modal-body text-center py-3">
                        <div class="mb-3">
                            {% if current_user.foto_url %}
                                <img src="{{ current_user.foto_url }}" class="rounded-circle object-fit-cover mb-2 shadow" style="width: 90px; height: 90px; border: 2px solid var(--btn-bg);">
                            {% else %}
                                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center fw-bold fs-2 mb-2 shadow" style="width: 90px; height: 90px;">
                                    {{ current_user.nome[0] | upper if current_user.nome else 'U' }}
                                </div>
                            {% endif %}
                        </div>
                        <label for="fotoInput" class="form-label small text-muted">Selecione uma imagem (PNG, JPG, JPEG)</label>
                        <input class="form-control form-control-sm" type="file" id="fotoInput" name="foto" accept="image/*" required>
                    </div>
                    <div class="modal-footer border-top border-secondary border-opacity-25 py-2">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-upload me-1"></i> Enviar Foto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endif %}

    <!-- Conteúdo Dinâmico -->
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS e Lógica do Tema -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script nonce="{{ csp_nonce() }}">
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.className = 'bi bi-sun-fill text-warning';
            } else {
                themeIcon.className = 'bi bi-moon-stars-fill text-dark';
            }
        }

        // Define o ícone correto ao carregar a página
        updateIcon(htmlElement.getAttribute('data-theme'));

        // Evento de clique para trocar o tema
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        // Auto-dismiss alerts after 5 seconds
        setTimeout(function() {
            var alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                var bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 5000);
    </script>
</body>
</html>
