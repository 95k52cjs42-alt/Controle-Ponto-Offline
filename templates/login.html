{% extends 'base.html' %}

{% block content %}
<style>
    :root {
        --pastel-bg: #f7f9fc;
        --text-dark: #2d3748;
        --border-soft: #edf2f7;
        --radius-xl: 28px;
        --radius-md: 16px;
    }

    .fade-in-up {
        animation: fadeInUp 0.5s ease-out forwards;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .pastel-card {
        background: #ffffff;
        border: 2px solid #ffffff;
        border-radius: var(--radius-xl);
        box-shadow: 0 10px 30px rgba(160, 175, 200, 0.12);
    }

    .form-control {
        border-radius: 14px;
        border: 1px solid var(--border-soft);
        background-color: #f8fafc;
        padding: 0.75rem 1rem;
        transition: all 0.2s ease;
    }

    .form-control:focus {
        background-color: #ffffff;
        border-color: #cbd5e1;
        box-shadow: 0 0 0 4px rgba(226, 232, 240, 0.6);
    }

    .btn-login {
        background-color: #1e293b;
        color: #ffffff;
        border-radius: 14px;
        padding: 0.75rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .btn-login:hover {
        background-color: #0f172a;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .brand-icon {
        width: 48px;
        height: 48px;
        background-color: #f1f5f9;
        color: #334155;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        margin-bottom: 1rem;
    }
</style>

<div class="row justify-content-center align-items-center fade-in-up py-4" style="min-height: 75vh;">
    <div class="col-sm-10 col-md-6 col-lg-5 col-xl-4">
        <div class="pastel-card p-4 p-md-5">
            
            <!-- Icone e Cabeçalho -->
            <div class="text-center mb-4">
                <div class="brand-icon shadow-sm">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>
                <h3 class="fw-bold mb-1 text-dark">Entrar no Sistema</h3>
                <p class="text-muted small">Informe seus dados para acessar sua conta</p>
            </div>

            <!-- Formulário de Login -->
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium text-dark small">E-mail</label>
                    <div class="position-relative">
                        <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="senha" class="form-label fw-medium text-dark small m-0">Senha</label>
                    </div>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-login w-100 mb-3">
                    <i class="bi bi-arrow-right-circle me-1"></i> Acessar Conta
                </button>
            </form>

            <!-- Rodapé / Cadastre-se -->
            <div class="text-center pt-3 border-top border-light">
                <span class="text-muted small">Ainda não possui uma conta?</span>
                <a href="{{ url_for('cadastro') }}" class="small fw-semibold text-dark text-decoration-none ms-1 hover-underline">
                    Cadastre-se
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
