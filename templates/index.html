{% extends 'base.html' %}
{% block content %}
<h2>Controle de Ponto</h2>

<div style="background-color: #e0e0e0; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 20px;">
    Último ponto: {{ ultimo_ponto }}
</div>

<form action="/registrar/Entrada" method="POST">
    <button class="btn btn-entrada" {% if 'Entrada' in pontos_batidos %}disabled{% endif %}>Entrada</button>
</form>
<form action="/registrar/Almoço" method="POST">
    <button class="btn btn-almoco" {% if 'Almoço' in pontos_batidos %}disabled{% endif %}>Almoço</button>
</form>
<form action="/registrar/Retorno" method="POST">
    <button class="btn btn-retorno" {% if 'Retorno' in pontos_batidos %}disabled{% endif %}>Retorno</button>
</form>
<form action="/registrar/Saída" method="POST">
    <button class="btn btn-saida" {% if 'Saída' in pontos_batidos %}disabled{% endif %}>Saída</button>
</form>

<a href="/exportar-pdf" style="text-decoration: none;">
    <button class="btn btn-pdf">📄 Exportar Meu PDF</button>
</a>
{% endblock %}
