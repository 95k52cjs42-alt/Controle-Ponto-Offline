{# Grade de ícones: cada atalho é um quadradinho com ícone colorido e nome curto. #}
<div class="dashboard-card atalhos-card h-100" aria-label="Ações rápidas">
    <div class="atalho-grade">
        {% if current_user.is_rh %}
        <button type="button" class="atalho" data-bs-toggle="modal" data-bs-target="#modalExportarPonto" title="Exportar folha de ponto">
            <span class="atalho-icone" style="--cor: 16, 185, 129;"><i class="bi bi-file-earmark-spreadsheet"></i></span>
            <span class="atalho-nome">Exportar</span>
        </button>
        <a href="{{ url_for('admin_exportar_afd') }}" class="atalho" title="Gerar AFD (Portaria 671)">
            <span class="atalho-icone" style="--cor: 100, 116, 139;"><i class="bi bi-file-earmark-text"></i></span>
            <span class="atalho-nome">Gerar AFD</span>
        </a>
        <button type="button" class="atalho" data-bs-toggle="modal" data-bs-target="#modalLembrete" title="Enviar lembrete para a equipe">
            <span class="atalho-icone" style="--cor: 245, 158, 11;"><i class="bi bi-megaphone"></i></span>
            <span class="atalho-nome">Lembrete</span>
        </button>
        <button type="button" class="atalho" data-bs-toggle="modal" data-bs-target="#modalLancarPontoManual" title="Lançar ponto manual">
            <span class="atalho-icone" style="--cor: 37, 99, 235;"><i class="bi bi-clock-history"></i></span>
            <span class="atalho-nome">Ponto manual</span>
        </button>
        <button type="button" class="atalho" data-bs-toggle="modal" data-bs-target="#modalNovoUsuario" title="Cadastrar colaborador">
            <span class="atalho-icone" style="--cor: 139, 92, 246;"><i class="bi bi-person-plus"></i></span>
            <span class="atalho-nome">Novo colaborador</span>
        </button>
        {% endif %}
        {% if current_user.is_ti %}
        <a href="{{ url_for('admin_parametros') }}#setores" class="atalho" title="Setores e cargas horárias">
            <span class="atalho-icone" style="--cor: 14, 165, 233;"><i class="bi bi-building"></i></span>
            <span class="atalho-nome">Setores</span>
        </a>
        <button type="button" class="atalho" data-bs-toggle="modal" data-bs-target="#modalInformarFeriado" title="Informar feriado">
            <span class="atalho-icone" style="--cor: 239, 68, 68;"><i class="bi bi-calendar-event"></i></span>
            <span class="atalho-nome">Feriado</span>
        </button>
        {% endif %}
    </div>
</div>
