{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center py-4" style="min-height: 75vh;">
    <div class="col-sm-10 col-md-6 col-lg-5 col-xl-4">
        <div class="pastel-card p-4 p-md-5">
            <h3 class="fw-bold mb-3 text-dark">Confirmar e-mail</h3>
            <p class="text-muted small">Confirme que este endereço pertence a você.</p>
            <form method="POST" action="{{ url_for('confirm_email', token=token) }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-login w-100">Confirmar e-mail</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
